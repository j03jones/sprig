name: Mobile builds

# Builds the Android and iOS apps (Capacitor shells around web/) on every push to main.
# These are unsigned test builds: a debug APK you can install on an Android phone, and a
# simulator build that proves the iOS project compiles. Store releases need signing keys.
on:
  push:
    branches: [main]
    paths: ["web/**", "android/**", "ios/**", "package*.json", "capacitor.config.json", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["web/**", "android/**", "ios/**", "package*.json", "capacitor.config.json", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Sprig-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package the simulator app
        run: ditto -c -k --keepParent ios/App/build/Build/Products/Debug-iphonesimulator/App.app Sprig-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sprig-ios-simulator
          path: Sprig-ios-simulator.zip
          if-no-files-found: error
